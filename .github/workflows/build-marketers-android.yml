name: Build Marketers Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-marketers-app
    paths:
      - "برنامج ادارة المسوقين/**"
      - ".github/workflows/build-marketers-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: برنامج ادارة المسوقين
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare mobile web assets
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basma-marketers-debug-apk
          path: "برنامج ادارة المسوقين/android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
